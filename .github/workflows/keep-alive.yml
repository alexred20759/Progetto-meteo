
# ============================================================
# Progetto Meteo
# Workflow: Keep Alive Streamlit
#
# Controlla periodicamente l'applicazione Streamlit.
# Se compare la schermata di sospensione, prova a riattivarla.
#
# Dopo il controllo avvia il Meteo Bot.
# ============================================================

name: Streamlit Keep Alive

on:
  # Esecuzione automatica ogni 4 ore (orario UTC).
  schedule:
    - cron: "0 */4 * * *"

  # Permette anche l'avvio manuale da GitHub Actions.
  workflow_dispatch:

# Permessi minimi necessari.
permissions:
  contents: read

jobs:

  # ==========================================================
  # JOB 1 - CONTROLLO E RIATTIVAZIONE STREAMLIT
  # ==========================================================

  keep-alive:
    name: Controllo applicazione Meteo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # --------------------------------------------------------
      # 1. Preparazione ambiente Python
      # --------------------------------------------------------

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # 2. Installazione Playwright
      # --------------------------------------------------------

      - name: Installa Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      # --------------------------------------------------------
      # 3. Installazione browser Chromium
      # --------------------------------------------------------

      - name: Installa Chromium
        run: |
          python -m playwright install --with-deps chromium

      # --------------------------------------------------------
      # 4. Apertura e controllo applicazione Streamlit
      # --------------------------------------------------------

      - name: Controlla e riattiva applicazione
        run: |
          python - <<'PY'
          import re
          import sys

          from playwright.sync_api import sync_playwright

          sys.stdout.reconfigure(encoding="utf-8")

          URL_APP = (
              "https://progetto-meteo-gvm3zvz4cadns7gxmvm9hc.streamlit.app/"
          )

          def main():

              with sync_playwright() as playwright:

                  browser = playwright.chromium.launch(
                      headless=True
                  )

                  try:

                      page = browser.new_page()

                      page.set_default_timeout(30000)

                      print("Apro l'applicazione Meteo...")

                      page.goto(
                          URL_APP,
                          wait_until="domcontentloaded",
                          timeout=90000
                      )

                      # Attende il caricamento iniziale.
                      page.wait_for_timeout(10000)

                      # ------------------------------------------------
                      # Controllo schermata di sospensione
                      # ------------------------------------------------

                      testo_pagina = page.locator(
                          "body"
                      ).inner_text()

                      if re.search(
                          r"get this app back up",
                          testo_pagina,
                          re.IGNORECASE
                      ):

                          print(
                              "Applicazione sospesa. "
                              "Provo a riattivarla..."
                          )

                          pulsante = page.get_by_role(
                              "button",
                              name=re.compile(
                                  r"yes,\s*get this app back up",
                                  re.IGNORECASE
                              )
                          )

                          if pulsante.count() > 0:

                              pulsante.first.click()

                              print(
                                  "Richiesta di riattivazione inviata."
                              )

                              # Attende il caricamento dell'applicazione.
                              page.wait_for_timeout(60000)

                          else:

                              raise RuntimeError(
                                  "Schermata di sospensione rilevata, "
                                  "ma pulsante non trovato."
                              )

                      else:

                          print(
                              "Nessuna schermata di sospensione rilevata."
                          )

                      # ------------------------------------------------
                      # Verifica finale dello stato dell'applicazione
                      # ------------------------------------------------

                      testo_finale = page.locator(
                          "body"
                      ).inner_text()

                      if re.search(
                          r"get this app back up",
                          testo_finale,
                          re.IGNORECASE
                      ):

                          raise RuntimeError(
                              "L'applicazione risulta ancora sospesa."
                          )

                      print("Controllo completato.")

                      print(
                          "Titolo pagina:",
                          page.title()
                      )

                  finally:

                      browser.close()

          if __name__ == "__main__":

              try:

                  main()

              except Exception as errore:

                  print(
                      "Errore durante il controllo:",
                      errore
                  )

                  raise

          PY


  # ==========================================================
  # JOB 2 - AVVIO METEO BOT
  # ==========================================================

  avvia-meteo-bot:
    name: Avvia Meteo Bot

    # Il bot parte soltanto dopo il controllo Keep Alive.
    needs: keep-alive

    # Richiama il workflow dedicato al Meteo Bot.
    uses: ./.github/workflows/meteo-bot.yml
