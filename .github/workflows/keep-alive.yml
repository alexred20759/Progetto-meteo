
# ============================================================
# Progetto Meteo
# Workflow: Keep Alive Streamlit
#
# Controlla periodicamente l'applicazione Streamlit.
# Se compare la schermata di sospensione, prova a riattivarla.
# ============================================================

name: Streamlit Keep Alive

on:
  # Esecuzione automatica ogni 4 ore (orario UTC).
  schedule:
    - cron: "0 */4 * * *"

  # Permette anche l'avvio manuale da GitHub Actions.
  workflow_dispatch:

# Permessi minimi necessari.
permissions:
  contents: read

jobs:
  keep-alive:
    name: Controllo applicazione Meteo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # 1. Preparazione ambiente Node.js
      # --------------------------------------------------------
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------------
      # 2. Installazione Playwright
      # --------------------------------------------------------
      - name: Installa Playwright
        run: npm install --no-save playwright

      # --------------------------------------------------------
      # 3. Installazione browser Chromium
      # --------------------------------------------------------
      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      # --------------------------------------------------------
      # 4. Apertura e controllo applicazione Streamlit
      # --------------------------------------------------------
      - name: Controlla e riattiva applicazione
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const URL_APP = 'https://progetto-meteo-gvm3zvz4cadns7gxmvm9hc.streamlit.app/';

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage();

              console.log('Apro l applicazione Meteo...');

              await page.goto(URL_APP, {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });

              await page.waitForTimeout(10000);

              // Controlla se Streamlit mostra la schermata di sospensione.
              const testoPagina = await page.locator('body').innerText();

              if (/get this app back up/i.test(testoPagina)) {
                console.log('Applicazione sospesa. Provo a riattivarla...');

                const pulsante = page.getByRole('button', {
                  name: /yes,\s*get this app back up/i
                });

                if (await pulsante.count() > 0) {
                  await pulsante.first().click();

                  console.log('Richiesta di riattivazione inviata.');

                  // Attende il caricamento dell'applicazione.
                  await page.waitForTimeout(60000);
                } else {
                  throw new Error(
                    'Schermata di sospensione rilevata, ma pulsante non trovato.'
                  );
                }
              } else {
                console.log('Nessuna schermata di sospensione rilevata.');
              }

              await page.waitForFunction(
                () => document.body && document.body.innerText.trim().length > 0,
                null,
                { timeout: 60000 }
              );

              const testoFinale = await page.locator('body').innerText();

              if (/get this app back up/i.test(testoFinale)) {
                throw new Error(
                  'L applicazione risulta ancora sospesa.'
                );
              }

              console.log('Controllo completato.');
              console.log('Titolo pagina:', await page.title());

            } finally {
              await browser.close();
            }
          }

          main().catch((errore) => {
            console.error('Errore durante il controllo:', errore);
            process.exitCode = 1;
          });
          NODE
