
# ============================================================
# Progetto Meteo
# Workflow: Meteo Bot
#
# Simula un utente che utilizza la dashboard Meteo.
#
# Operazioni:
# 1. Apre l'applicazione Streamlit.
# 2. Individua dinamicamente il frame Meteo.
# 3. Inserisce il nome di una città.
# 4. Cerca le località disponibili.
# 5. Seleziona casualmente una località.
# 6. Conferma la selezione.
# 7. Mostra le previsioni meteorologiche.
# 8. Verifica il caricamento dei dati.
#
# Avvio: manuale oppure richiamato da Keep Alive.
# ============================================================

name: Meteo Bot

on:
  # Permette a Keep Alive di richiamare questo workflow.
  workflow_call:

  # Permette l'avvio manuale da GitHub Actions.
  workflow_dispatch:

# Permessi minimi necessari.
permissions:
  contents: read

jobs:

  esegui-bot:

    name: Simulazione utente Meteo

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # --------------------------------------------------------
      # 1. Scarica il repository
      # --------------------------------------------------------

      - name: Scarica il repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Configura Python
      # --------------------------------------------------------

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --------------------------------------------------------
      # 3. Installa Playwright per Python
      # --------------------------------------------------------

      - name: Installa Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      # --------------------------------------------------------
      # 4. Installa Chromium
      # --------------------------------------------------------

      - name: Installa Chromium
        run: python -m playwright install --with-deps chromium

      # --------------------------------------------------------
      # 5. Avvia il bot
      # --------------------------------------------------------

      - name: Esegui il bot Meteo
        run: |
          python - <<'PY'

          import random
          import re
          import sys
          import time

          from playwright.sync_api import sync_playwright


          # Indirizzo pubblico dell'applicazione.
          URL_APP = (
              "https://progetto-meteo-gvm3zvz4cadns7gxmvm9hc.streamlit.app/"
          )


          # ====================================================
          # FUNZIONE PRINCIPALE
          # ====================================================

          def main():

              browser = None
              page = None

              try:

                  print("Apro l'applicazione Meteo...")

                  # Avvia Chromium senza interfaccia grafica.
                  playwright = sync_playwright().start()

                  browser = playwright.chromium.launch(
                      headless=True
                  )

                  # Crea una nuova pagina.
                  page = browser.new_page()

                  # Apre la dashboard.
                  page.goto(
                      URL_APP,
                      wait_until="domcontentloaded",
                      timeout=90000
                  )

                  print("Pagina aperta.")

                  # Attende il primo caricamento di Streamlit.
                  page.wait_for_timeout(15000)


                  # ------------------------------------------------
                  # 1. Ricerca dinamica del frame Meteo
                  # ------------------------------------------------

                  print("\nRICERCA DEL FRAME METEO...")

                  frame_meteo = None
                  campo_citta = None

                  # Tempo massimo di ricerca: 60 secondi.
                  tempo_inizio = time.monotonic()

                  while time.monotonic() - tempo_inizio < 60:

                      # Esamina tutti i frame presenti nella pagina.
                      for frame in page.frames:

                          try:

                              # Cerca il campo città nel frame.
                              campo = frame.get_by_label(
                                  "Nome della città"
                              )

                              # Verifica se il campo esiste ed è visibile.
                              if (
                                  campo.count() > 0
                                  and campo.is_visible()
                              ):

                                  frame_meteo = frame
                                  campo_citta = campo

                                  break

                          except Exception:

                              # Il frame potrebbe essere aggiornato
                              # durante il caricamento di Streamlit.
                              continue

                      if campo_citta is not None:
                          break

                      # Riprova dopo un secondo.
                      page.wait_for_timeout(1000)

                  if frame_meteo is None:

                      raise RuntimeError(
                          "Campo Nome della città non trovato "
                          "entro 60 secondi."
                      )

                  print("\nFRAME METEO INDIVIDUATO!")
                  print("URL FRAME:", frame_meteo.url)


                  # ------------------------------------------------
                  # 2. Inserimento del nome della città
                  # ------------------------------------------------

                  print("\nINSERIMENTO DELLA CITTÀ...")

                  campo_citta.fill("Roma")

                  print("Città inserita: Roma")


                  # ------------------------------------------------
                  # 3. Ricerca delle località
                  # ------------------------------------------------

                  print("\nRICERCA DELLE LOCALITÀ...")

                  pulsante_cerca = frame_meteo.get_by_role(
                      "button",
                      name=re.compile(
                          "Cerca località",
                          re.IGNORECASE
                      )
                  )

                  pulsante_cerca.click()

                  print("Pulsante Cerca località cliccato.")

                  # Attende l'aggiornamento di Streamlit.
                  page.wait_for_timeout(3000)


                  # ------------------------------------------------
                  # 4. Individuazione del menu a tendina
                  # ------------------------------------------------

                  print("\nRICERCA DEL MENU A TENDINA...")

                  selettore_localita = frame_meteo.get_by_role(
                      "combobox",
                      name="Seleziona la località"
                  )

                  selettore_localita.wait_for(
                      state="visible",
                      timeout=60000
                  )

                  print("Menu delle località individuato!")


                  # ------------------------------------------------
                  # 5. Apertura del menu
                  # ------------------------------------------------

                  print("\nAPERTURA DEL MENU...")

                  selettore_localita.click()

                  page.wait_for_timeout(1000)


                  # ------------------------------------------------
                  # 6. Lettura delle località disponibili
                  # ------------------------------------------------

                  print("\nLOCALITÀ DISPONIBILI:")

                  opzioni = frame_meteo.get_by_role("option")

                  numero_opzioni = opzioni.count()

                  print("Numero di opzioni:", numero_opzioni)

                  if numero_opzioni == 0:

                      raise RuntimeError(
                          "Nessuna località disponibile nel menu."
                      )

                  # Legge tutte le località e i relativi testi.
                  localita_disponibili = []

                  for indice in range(numero_opzioni):

                      testo = opzioni.nth(indice).inner_text().strip()

                      localita_disponibili.append(testo)

                      print(f"{indice + 1}. {testo}")


                  # ------------------------------------------------
                  # 7. Selezione casuale della località
                  # ------------------------------------------------

                  print("\nSELEZIONE DELLA LOCALITÀ...")

                  # Sceglie casualmente un indice tra quelli disponibili.
                  indice_scelto = random.randrange(numero_opzioni)

                  localita_scelta = localita_disponibili[indice_scelto]

                  print("Località scelta:", localita_scelta)

                  # Clicca sull'opzione scelta.
                  opzioni.nth(indice_scelto).click()

                  print("Località selezionata.")

                  # Attende che Streamlit aggiorni la selezione.
                  page.wait_for_timeout(2000)


                  # ------------------------------------------------
                  # 8. Ricerca del pulsante Mostra previsioni
                  # ------------------------------------------------

                  print(
                      "\nRICERCA DEL PULSANTE MOSTRA PREVISIONI..."
                  )

                  pulsante_previsioni = frame_meteo.get_by_role(
                      "button",
                      name=re.compile(
                          "Mostra previsioni",
                          re.IGNORECASE
                      )
                  )

                  pulsante_previsioni.wait_for(
                      state="visible",
                      timeout=60000
                  )

                  print(
                      "Pulsante Mostra previsioni individuato!"
                  )

                  # Verifica che il pulsante sia abilitato.
                  if not pulsante_previsioni.is_enabled():

                      raise RuntimeError(
                          "Il pulsante Mostra previsioni non è abilitato."
                      )


                  # ------------------------------------------------
                  # 9. Avvio delle previsioni
                  # ------------------------------------------------

                  print("\nAVVIO DELLE PREVISIONI...")

                  # Memorizza il testo presente prima del clic.
                  testo_precedente = frame_meteo.locator(
                      "body"
                  ).inner_text()

                  # Clicca sul pulsante.
                  pulsante_previsioni.click()

                  print(
                      "Pulsante Mostra previsioni cliccato."
                  )

                  print(
                      "\nATTENDO IL CARICAMENTO DEI RISULTATI..."
                  )


                  # ------------------------------------------------
                  # 10. Attesa dei risultati
                  # ------------------------------------------------

                  tempo_inizio_risultati = time.monotonic()

                  testo_corrente = ""
                  secondi_stabile = 0
                  risultato_caricato = False

                  # Tempo massimo di attesa: 90 secondi.
                  while time.monotonic() - tempo_inizio_risultati < 90:

                      try:

                          # Legge il contenuto aggiornato della dashboard.
                          testo_corrente = frame_meteo.locator(
                              "body"
                          ).inner_text()

                          # Controlla se Streamlit sta ancora elaborando.
                          spinner = frame_meteo.locator(
                              '[data-testid="stSpinner"]'
                          )

                          caricamento_in_corso = (
                              spinner.count() > 0
                              and spinner.first.is_visible()
                          )

                          # Verifica che il contenuto sia cambiato
                          # e che non ci siano più indicatori di caricamento.
                          if (
                              testo_corrente != testo_precedente
                              and not caricamento_in_corso
                              and "Running..." not in testo_corrente
                          ):

                              secondi_stabile += 1

                          else:

                              secondi_stabile = 0

                          # Il contenuto deve superare tre controlli
                          # consecutivi senza indicatori di caricamento.
                          if secondi_stabile >= 3:

                              risultato_caricato = True
                              break

                      except Exception:

                          # Streamlit potrebbe aggiornare il frame
                          # mentre leggiamo il contenuto.
                          secondi_stabile = 0

                      # Controllo ogni secondo.
                      page.wait_for_timeout(1000)


                  # ------------------------------------------------
                  # 11. Verifica finale
                  # ------------------------------------------------

                  if risultato_caricato:

                      print("\nPREVISIONI CARICATE!")

                      print("\nCONTENUTO VISIBILE:")

                      print(testo_corrente[-3000:])

                  else:

                      print(
                          "\nATTENZIONE: RISULTATI NON VERIFICATI."
                      )

                      print(
                          "Il tempo massimo di attesa è stato raggiunto."
                      )

                      print("\nCONTENUTO ATTUALE:")

                      print(testo_corrente[-3000:])

                      raise RuntimeError(
                          "Le previsioni non sono state verificate."
                      )


                  # ------------------------------------------------
                  # 12. Screenshot finale
                  # ------------------------------------------------

                  page.screenshot(
                      path="diagnostica_meteo.png",
                      full_page=True
                  )

                  print("\nScreenshot finale salvato.")

                  print("\nTEST COMPLETATO CON SUCCESSO!")

                  # Mantiene aperto il browser per altri 10 secondi.
                  page.wait_for_timeout(10000)

              except Exception as errore:

                  print(
                      "\nERRORE DURANTE IL CONTROLLO:",
                      errore
                  )

                  # Prova a salvare uno screenshot diagnostico.
                  if page is not None and not page.is_closed():

                      try:

                          page.screenshot(
                              path="diagnostica_meteo.png",
                              full_page=True
                          )

                          print(
                              "Screenshot diagnostico salvato."
                          )

                      except Exception as errore_screenshot:

                          print(
                              "Impossibile salvare lo screenshot:",
                              errore_screenshot
                          )

                  raise

              finally:

                  # Chiude il browser soltanto alla fine del test.
                  if browser is not None:

                      browser.close()

                      print("\nBrowser chiuso.")

                  if "playwright" in locals():

                      playwright.stop()


          # ====================================================
          # AVVIO DEL BOT
          # ====================================================

          if __name__ == "__main__":

              try:

                  # Mantiene la codifica UTF-8 per i messaggi.
                  if hasattr(sys.stdout, "reconfigure"):
                      sys.stdout.reconfigure(encoding="utf-8")

                  main()

              except Exception as errore:

                  print(
                      "\nESECUZIONE DEL BOT FALLITA:",
                      errore
                  )

                  sys.exit(1)

          PY

      # --------------------------------------------------------
      # 6. Salva lo screenshot del test
      # --------------------------------------------------------

      - name: Salva screenshot del test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultato-test-meteo
          path: diagnostica_meteo.png
          if-no-files-found: ignore
          retention-days: 7
